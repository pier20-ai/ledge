<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Deny everything, then allow the bundle. `connect-src 'none'` is the
      load-bearing one: the transcript is model output, and a surface that could
      reach the network on its instructions would be an exfiltration path
      through the user's notch. `file:` is listed alongside 'self' because a
      file:// document's origin is opaque in WebKit, so 'self' alone does not
      match its own siblings.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ledge editor</title>
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="./editor.js"></script>
  </body>
</html>
